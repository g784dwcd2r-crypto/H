name: daily-refresh
# 06:00 America/New_York. GitHub cron is UTC, so fire at both 10:00 (EDT) and 11:00 (EST) and let the job
# skip the one that is not 06:00 local. Move to a proper worker (Phase 4) once the lake outgrows a runner.
# Only one scheduler may own a lake: this job runs only when the LAKE_ROOT secret is set. In the free
# layout (render.yaml) this workflow IS the scheduler; in the full layout (deploy/render.full.yaml)
# the filings-hub-worker service is, so leave the LAKE_ROOT secret unset in that case.
on:
  schedule:
    - cron: "0 10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      index_date:
        description: "daily index date (YYYY-MM-DD); empty = catch up to yesterday"
        required: false
concurrency:
  group: disclosure-daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: only run at 06:00 New York time
        id: gate
        run: |
          if [ -z "${{ secrets.LAKE_ROOT }}" ]; then
            echo "LAKE_ROOT secret not set: another scheduler owns the lake; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v3
        if: steps.gate.outputs.run == 'true'
      - run: uv sync --frozen --python 3.12 --extra s3
        if: steps.gate.outputs.run == 'true'
      - name: refresh
        if: steps.gate.outputs.run == 'true'
        env:
          INDEX_DATE: ${{ github.event.inputs.index_date }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          LAKE_ROOT: ${{ secrets.LAKE_ROOT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$INDEX_DATE" ]; then
            .venv/bin/filings-hub refresh --date "$INDEX_DATE"
          else
            .venv/bin/filings-hub refresh
          fi
