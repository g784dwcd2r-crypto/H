# Render Blueprint, free-tier layout: two free web services serving straight from the lake in
# object storage (DuckDB, no Postgres). The daily refresh runs in GitHub Actions
# (.github/workflows/refresh.yml), so nothing here is billed. Trade-offs: free services sleep after
# 15 minutes idle (the first request afterwards takes ~30 s) and queries read Parquet from R2/S3
# instead of Postgres, so they are slower than the README's benchmark numbers.
#
# The paid layout (Render Postgres for serving, an always-on worker for the refresh) is
# deploy/render.full.yaml; copy it over this file to upgrade.
#
# Dashboard -> New -> Blueprint -> this repo. Fill in the `sync: false` values when prompted.

envVarGroups:
  - name: filings-hub-lake
    envVars:
      - key: SEC_USER_AGENT
        sync: false            # "Company Name contact@email" (SEC fair-access policy)
      - key: LAKE_ROOT
        sync: false            # s3://bucket/filings-hub
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false            # AWS: the bucket's region. Cloudflare R2: auto
      - key: AWS_ENDPOINT_URL
        sync: false            # AWS: leave empty. R2: https://<account-id>.r2.cloudflarestorage.com

services:
  - type: web
    name: filings-hub-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: filings-hub api        # binds to Render's $PORT; DATABASE_URL unset = DuckDB over the lake
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: filings-hub-lake
      - key: API_KEY
        generateValue: true               # the web service reads it back via envVarKey below
      - key: SESSION_SECRET
        generateValue: true               # signs sign-in sessions; keep it stable across deploys
      - key: SITE_URL
        value: https://filings-hub-web.onrender.com   # where sign-in links and alert emails point
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "600"

  - type: web
    name: filings-hub-web
    runtime: docker
    region: oregon
    plan: free
    rootDir: web
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: FILINGS_API_URL
        value: https://filings-hub-api.onrender.com   # public URL: free services have no private network.
                                                      # If Render gave the API a suffixed name, use that URL.
      - key: FILINGS_API_KEY
        fromService:
          type: web
          name: filings-hub-api
          envVarKey: API_KEY
