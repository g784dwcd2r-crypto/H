[project]
name = "filings-hub"
version = "0.1.0"
description = "SEC EDGAR filings hub: any registered company -> period-organised filings -> as-reported statements -> Excel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=17",
    "httpx>=0.27",
    "orjson>=3.10",
    "openpyxl>=3.1",
    "pypdf>=6.18.1",
    "psycopg[binary]>=3.2",
    "fsspec>=2024.6",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "httpx>=0.27",
    "respx>=0.21",
    "moto[server]>=5",
    "s3fs>=2024.6",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pandas>=2.2",
]

[project.scripts]
filings-hub = "filings_hub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filings_hub"]
# reference data read at runtime by `filings-hub verify`
artifacts = ["filings_hub/data/*.csv", "filings_hub/data/*.md"]

[tool.hatch.build.targets.sdist]
include = ["filings_hub", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
extend-exclude = ["notebooks"]  # exploratory; not held to the package's line length and one-statement-per-line style
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "B008", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"filings_hub/testing/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
source = ["filings_hub"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
